spring.datasource.url=jdbc:postgresql://localhost:5432/lab5
spring.datasource.username=java
spring.datasource.password=java

spring.jpa.hibernate.ddl-auto=none

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.security.filter.dispatcher-types=request,async,error

app.security.jwt.secret=58WetneIa+xfwak2pGanPNwxjwox60mMroXTg5k1N98=
app.security.jwt.expiration=3600000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=prefschedule-group
# Make Kafka consumers more tolerant of connection failures
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
kafka.topic.grades=grades-topic
kafka.topic.dlq=grades-topic.DLT

# Suppress Kafka logs (set to ERROR to hide WARN messages)
logging.level.org.apache.kafka=ERROR
logging.level.org.springframework.kafka=ERROR
logging.level.kafka=ERROR
logging.level.org.apache.kafka.clients=ERROR
logging.level.org.apache.kafka.common=ERROR

# StableMatch Service Configuration
stablematch.service.url=http://localhost:8081

# Resilience4j Configuration
resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=1000
resilience4j.retry.configs.default.enableExponentialBackoff=true
resilience4j.retry.configs.default.exponentialBackoffMultiplier=2

resilience4j.retry.instances.stableMatchRetry.baseConfig=default
resilience4j.retry.instances.stableMatchRetry.maxAttempts=3

# TimeLimiter Configuration
resilience4j.timelimiter.configs.default.timeoutDuration=10000
resilience4j.timelimiter.instances.stableMatchTimeout.timeoutDuration=10000