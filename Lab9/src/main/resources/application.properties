spring.application.name=api-gateway
server.port=8080

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Gateway Routes Configuration
spring.cloud.gateway.routes[0].id=stable-match-route
spring.cloud.gateway.routes[0].uri=lb://StableMatch
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/stable-match/**

# Load Balancing Configuration
spring.cloud.loadbalancer.ribbon.enabled=false
spring.cloud.loadbalancer.cache.enabled=true
spring.cloud.loadbalancer.cache.ttl=10s
spring.cloud.loadbalancer.cache.capacity=256

# Grafana Alert Configuration
grafana.url=http://localhost:3000
grafana.username=admin
grafana.password=admin
grafana.alert.enabled=true
